<script>
  import { onMount } from "olum";

  const state = { seconds: 0 };

  onMount(() => {
    const interval = setInterval(() => state.seconds++, 1000);
    return () => clearInterval(interval); // onDestroy
  });
</script>

<p>
  The page has been open for
  {state.seconds}
  {state.seconds === 1 ? "second" : "seconds"}
</p>
