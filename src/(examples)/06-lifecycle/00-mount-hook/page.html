<script>
  import { onMount } from "olum";

  const state = { photos: [] };

  onMount(async () => {
    const res = await fetch(`https://picsum.photos/v2/list?page=2&limit=20`);
    state.photos = await res.json();
  });
</script>

<style>
  .photos {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-gap: 8px;
  }

  figure,
  img {
    width: 100%;
    margin: 0;
  }
</style>

<h1>Image grid</h1>

<div class="photos">
  <if when="state.photos.length > 0">
    <for each="photo of state.photos">
      <figure>
        <img
          src="https://picsum.photos/id/{photo.id}/300/200"
          alt="photo by {photo.author}"
        />
        <figcaption>{photo.author}</figcaption>
      </figure>
    </for>
  </if>
  <else>
    <p>fetching photos…</p>
  </else>
</div>
