<script>
  import { props, onMount } from "olum";
  const { onLog } = props();

  const state = { seconds: 0 };

  onMount(() => {
    console.log("stopwatch mounted — timer started");
    const interval = setInterval(() => state.seconds++, 1000);

    return () => {
      clearInterval(interval);
      onLog("🧹 cleanup ran — timer cleared, stopwatch unmounted");
      console.log("stopwatch unmounted — timer cleared");
    };
  });
</script>

<style>
  p {
    display: inline-block;
    padding: 0.3rem 0.8rem;
    border: 1px solid #25c97e;
    border-radius: 8px;
    background: rgba(37, 201, 126, 0.1);
  }
</style>

<p>⏱ elapsed: {state.seconds} {state.seconds === 1 ? "second" : "seconds"}</p>
