<script>
  const pad = (x, len) => {
    x = String(x);
    while (x.length < len) x = `0${x}`;
    return x;
  };

  const tomorrow = new Date(Date.now() + 86400000);
  const initialDate = [
    tomorrow.getFullYear(),
    pad(tomorrow.getMonth() + 1, 2),
    pad(tomorrow.getDate(), 2),
  ].join("-");

  const state = { start: initialDate, end: initialDate, isReturn: false };

  const convertToDate = (str) => {
    const split = str.split("-");
    return new Date(+split[0], +split[1] - 1, +split[2]);
  };

  const startDate = () => convertToDate(state.start);
  const endDate = () => convertToDate(state.end);

  const bookFlight = () => {
    const type = state.isReturn ? "return" : "one-way";
    let message = `Booking confirmed: ${type} flight departing ${startDate().toDateString()}`;
    if (type === "return") {
      message += `, returning ${endDate().toDateString()}`;
    }
    alert(message);
  };
</script>

<style>
  select,
  input,
  button {
    display: block;
    margin: 0.5em 0;
    font-size: inherit;
  }
</style>

<select onchange="(e) => (state.isReturn = e.target.value === 'true')">
  <option value="false" selected="{!state.isReturn}">one-way flight</option>
  <option value="true" selected="{state.isReturn}">return flight</option>
</select>

<input
  type="date"
  value="{state.start}"
  oninput="(e) => (state.start = e.target.value)"
/>
<input
  type="date"
  value="{state.end}"
  disabled="{!state.isReturn}"
  oninput="(e) => (state.end = e.target.value)"
/>

<button
  onclick="bookFlight()"
  disabled="{state.isReturn && startDate() >= endDate()}"
>
  book
</button>
