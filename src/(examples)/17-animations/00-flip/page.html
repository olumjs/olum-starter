<script>
  import { crossfade, easings } from "olum";

  const fallback = (node) => {
    const style = getComputedStyle(node);
    const transform = style.transform === "none" ? "" : style.transform;
    return {
      duration: 600,
      easing: easings.quintOut,
      css: (t) => `transform: ${transform} scale(${t}); opacity: ${t}`,
    };
  };

  const _cf = crossfade({ fallback });
  const send = (node, params) => _cf[0](node, params);
  const receive = (node, params) => _cf[1](node, params);

  const pending = () => state.todos.filter((t) => !t.done);
  const finished = () => state.todos.filter((t) => t.done);

  const state = {
    todos: [
      { id: 1, done: false, description: "water the plants" },
      { id: 2, done: false, description: "prep slides for the meetup" },
      { id: 3, done: true, description: "restock the pantry" },
      { id: 4, done: false, description: "book the dentist" },
      { id: 5, done: false, description: "walk the dog" },
      { id: 6, done: false, description: "triage the backlog" },
    ],
  };

  let uid = state.todos.length + 1;

  const add = (input) => {
    const todo = { id: uid++, done: false, description: input.value };
    state.todos = [todo, ...state.todos];
    input.value = "";
  };

  const keydown = (e) => {
    if (e.key === "Enter") add(e.target);
  };

  const toggle = (todo) => {
    state.todos = state.todos.map((t) =>
      t.id === todo.id
        ? { id: t.id, done: !t.done, description: t.description }
        : t,
    );
  };

  const remove = (todo) =>
    (state.todos = state.todos.filter((t) => t.id !== todo.id));
</script>

<div class="board">
  <input
    class="new-todo"
    placeholder="what needs doing?"
    onkeydown="keydown($event)"
  />

  <div class="columns">
    <section class="column">
      <h2>To do <span class="count">{pending().length}</span></h2>
      <div class="list">
        <for each="todo of pending()" key="todo.id">
          <transition
            in="receive({ key: todo.id })"
            out="send({ key: todo.id })"
            flip
          >
            <label class="todo-item">
              <input
                type="checkbox"
                checked="{todo.done}"
                onchange="toggle(todo)"
              />
              <span class="text">{todo.description}</span>
              <button class="remove" onclick="remove(todo)">×</button>
            </label>
          </transition>
        </for>
      </div>
    </section>

    <section class="column column-done">
      <h2>Done <span class="count">{finished().length}</span></h2>
      <div class="list">
        <for each="todo of finished()" key="todo.id">
          <transition
            in="receive({ key: todo.id })"
            out="send({ key: todo.id })"
            flip
          >
            <label class="todo-item">
              <input
                type="checkbox"
                checked="{todo.done}"
                onchange="toggle(todo)"
              />
              <span class="text">{todo.description}</span>
              <button class="remove" onclick="remove(todo)">×</button>
            </label>
          </transition>
        </for>
      </div>
    </section>
  </div>
</div>
