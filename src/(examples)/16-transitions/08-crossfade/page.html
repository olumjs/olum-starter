<script>
  import { crossfade, transitions, easings } from "olum";

  const _cf = crossfade({
    duration: 600,
    easing: easings.quintOut,
    fallback: transitions.scale,
  });
  const send = (node, params) => _cf[0](node, params);
  const receive = (node, params) => _cf[1](node, params);

  const state = { inA: true };
  const move = () => (state.inA = !state.inA);
</script>

<h1>Crossfade</h1>
<p class="hint">
  <code>crossfade()</code> flies the same element between two spots, keyed off a
  primitive id.
</p>

<div class="board">
  <div class="slots">
    <div class="slot">
      <if when="state.inA">
        <transition in="receive({ key: 1 })" out="send({ key: 1 })">
          <div class="box"></div>
        </transition>
      </if>
    </div>

    <div class="slot">
      <if when="!state.inA">
        <transition in="receive({ key: 1 })" out="send({ key: 1 })">
          <div class="box"></div>
        </transition>
      </if>
    </div>
  </div>

  <button onclick="move()">Move it across</button>
</div>
