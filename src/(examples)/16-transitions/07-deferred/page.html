<script>
  import { crossfade, transitions } from "olum";
  import images from "./images.js";

  const ASSETS = "https://picsum.photos/id";
  const SIZE = 600;

  const _cf = crossfade({ duration: 200, fallback: transitions.scale });
  const send = (node, params) => _cf[0](node, params);
  const receive = (node, params) => _cf[1](node, params);

  const state = { selectedId: null, loadingId: null };
  const selected = () => images.find((img) => img.id === state.selectedId);

  const load = (image) => {
    const timeout = setTimeout(() => (state.loadingId = image.id), 100);
    const img = new Image();
    img.onload = () => {
      state.selectedId = image.id;
      clearTimeout(timeout);
      state.loadingId = null;
    };
    img.src = `${ASSETS}/${image.photoId}/${SIZE}/${SIZE}`;
  };

  const dismiss = () => (state.selectedId = null);
</script>

<div class="container">
  <div class="phone">
    <h1>Photo gallery</h1>

    <div class="grid">
      <for each="image of images" key="image.id">
        <div class="square">
          <if when="state.selectedId !== image.id">
            <transition
              in="receive({ key: image.id })"
              out="send({ key: image.id })"
            >
              <button
                style="background-color: {image.color};"
                onclick="load(image)"
              >
                {state.loadingId === image.id ? '...' : image.id}
              </button>
            </transition>
          </if>
        </div>
      </for>
    </div>

    <if when="state.selectedId">
      <transition
        in="receive({ key: state.selectedId })"
        out="send({ key: state.selectedId })"
      >
        <div class="photo">
          <img
            alt="{selected().alt}"
            src="{ASSETS}/{selected().photoId}/{SIZE}/{SIZE}"
            onclick="dismiss()"
          />
          <p class="credit">
            {selected().alt} &ndash;
            <a target="_blank" rel="noreferrer" href="https://picsum.photos"
              >Lorem Picsum</a
            >
          </p>
        </div>
      </transition>
    </if>
  </div>
</div>
