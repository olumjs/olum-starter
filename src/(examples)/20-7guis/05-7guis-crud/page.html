<!-- https://eugenkiss.github.io/7guis/tasks#crud -->
<script>
  const state = {
    people: [
      { first: "Hans", last: "Emil" },
      { first: "Max", last: "Mustermann" },
      { first: "Roman", last: "Tisch" },
    ],
    prefix: "",
    first: "",
    last: "",
    i: 0,
  };

  const filteredPeople = () =>
    state.prefix
      ? state.people.filter((person) => {
          const name = `${person.last}, ${person.first}`;
          return name.toLowerCase().startsWith(state.prefix.toLowerCase());
        })
      : state.people;

  const selectedPerson = () => filteredPeople()[state.i];

  const resetInputs = (person) => {
    state.first = person ? person.first : "";
    state.last = person ? person.last : "";
  };

  const watcher = {
    i(old, next) {
      resetInputs(selectedPerson());
    },
    prefix(old, next) {
      state.i = 0;
      resetInputs(selectedPerson());
    },
  };

  const create = () => {
    state.people = state.people.concat({ first: state.first, last: state.last });
    state.i = state.people.length - 1;
    state.first = state.last = "";
  };

  const update = () => {
    const person = selectedPerson();
    person.first = state.first;
    person.last = state.last;
    state.people = state.people;
  };

  const remove = () => {
    const person = selectedPerson();
    const index = state.people.indexOf(person);
    state.people = [...state.people.slice(0, index), ...state.people.slice(index + 1)];
    state.first = state.last = "";
    state.i = Math.min(state.i, filteredPeople().length - 1);
  };
</script>

<style>
  * {
    font-family: inherit;
    font-size: inherit;
  }

  input {
    display: block;
    margin: 0 0 0.5em 0;
  }

  select {
    float: left;
    margin: 0 1em 1em 0;
    width: 14em;
  }

  .buttons {
    clear: both;
  }
</style>

<input placeholder="filter prefix" value="{state.prefix}" oninput="(e) => state.prefix = e.target.value" />

<select size="5" onchange="(e) => state.i = +e.target.value">
  <for each="(person, index) of filteredPeople()">
    <option value="{index}" selected="{index === state.i}">{person.last}, {person.first}</option>
  </for>
</select>

<label><input value="{state.first}" placeholder="first" oninput="(e) => state.first = e.target.value" /></label>
<label><input value="{state.last}" placeholder="last" oninput="(e) => state.last = e.target.value" /></label>

<div class="buttons">
  <button onclick="create()" disabled="{!state.first || !state.last}">create</button>
  <button onclick="update()" disabled="{!state.first || !state.last || !selectedPerson()}">update</button>
  <button onclick="remove()" disabled="{!selectedPerson()}">delete</button>
</div>
