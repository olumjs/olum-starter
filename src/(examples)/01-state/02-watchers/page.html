<script>
  const state = { volume: 0 };

  const watcher = {
    volume(old, next) {
      if (next > 10) {
        alert(`the dial doesn't go past 10`);
        state.volume = 10;
      }
    },
  };

  const louder = () => state.volume++;
</script>

<button onclick="louder()">Volume: {state.volume}</button>
