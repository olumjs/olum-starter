<script>
  import { props } from "olum";
  import { eases, types } from "./eases.js";

  const {
    current_ease,
    current_type,
    duration,
    playing,
    width,
    setEase,
    setType,
    setDuration,
    onPlay,
  } = props();

  const easeNames = () => Array.from(eases.keys());
  const isMobile = () => width && width < 600;
</script>

<div class="easing-sidebar">
  <div class="easing-types">
    <h3>Ease</h3>
    <if when="isMobile()">
      <select onchange="(e) => setEase(e.target.value)">
        <for each="name of easeNames()">
          <option value="{name}" selected="{name === current_ease}">
            {name}
          </option>
        </for>
      </select>
    </if>
    <else>
      <ul>
        <for each="name of easeNames()">
          <li class="{name === current_ease ? 'selected' : ''}">
            <button onclick="setEase(name)">{name}</button>
          </li>
        </for>
      </ul>
    </else>

    <h3>Type</h3>
    <if when="isMobile()">
      <select onchange="(e) => setType(e.target.value)">
        <for each="t of types">
          <option value="{t[1]}">{t[0]}</option>
        </for>
      </select>
    </if>
    <else>
      <ul>
        <for each="t of types">
          <li class="{t[1] === current_type ? 'selected' : ''}">
            <button onclick="setType(t[1])">{t[0]}</button>
          </li>
        </for>
      </ul>
    </else>
  </div>

  <h4>Duration</h4>
  <div class="duration">
    <span>
      <input
        type="number"
        value="{duration}"
        min="0"
        step="100"
        onchange="(e) => setDuration(+e.target.value)"
      />
      <button class="number" onclick="setDuration(duration - 100)">-</button>
      <button class="number" onclick="setDuration(duration + 100)">+</button>
    </span>
    <button class="play" onclick="onPlay()">
      {playing ? 'Restart' : 'Play'}
    </button>
  </div>
</div>

  }

  }

  .duration {
    width: 100%;

  }

  .duration span {
