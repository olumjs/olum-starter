<script>
  const tabs = ["core", "router", "compiler"];

  const state = { current: "core" };

  const select = (tab) => (state.current = tab);
</script>

<for each="tab of tabs">
  <button class="{state.current === tab ? 'active' : ''}" onclick="select(tab)">{tab}</button>
</for>

<style>
  button {
    display: block;
  }

  .active {
    background-color: #25c97e;
    color: white;
  }
</style>
