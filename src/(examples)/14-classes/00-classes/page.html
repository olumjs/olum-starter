<script>
  const state = { current: "foo" };
</script>

<button class="{state.current === 'foo' ? 'active' : ''}" onclick="state.current = 'foo'">foo</button>

<button class="{state.current === 'bar' ? 'active' : ''}" onclick="state.current = 'bar'">bar</button>

<button class="{state.current === 'baz' ? 'active' : ''}" onclick="state.current = 'baz'">baz</button>

<style>
  button {
    display: block;
  }

  .active {
    background-color: #ff3e00;
    color: white;
  }
</style>
