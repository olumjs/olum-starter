<script>
  const state = { big: false };
  const setBig = (e) => (state.big = e.target.checked);
</script>

<label>
  <input type="checkbox" checked="{state.big}" onchange="setBig($event)" />
  big
</label>

<div class="{state.big ? 'big' : ''}">some {state.big ? 'big' : 'small'} text</div>

<style>
  .big {
    font-size: 4em;
  }
</style>
