<script>
  import { onMount } from "olum";
  import { longpress } from "./longpress.js";

  const state = { pressed: false, duration: 2000 };
  let action;
  const setDuration = (e) => {
    state.duration = +e.target.value;
    action?.update(state.duration);
  };

  onMount(() => {
    const button = host.querySelector("button");
    action = longpress(button, state.duration);
    const onLongpress = () => (state.pressed = true);
    const onMouseenter = () => (state.pressed = false);

    button.addEventListener("longpress", onLongpress);
    button.addEventListener("mouseenter", onMouseenter);

    return () => {
      button.removeEventListener("longpress", onLongpress);
      button.removeEventListener("mouseenter", onMouseenter);
      action.destroy();
    };
  });
</script>

<label>
  <input
    type="range"
    value="{state.duration}"
    oninput="setDuration($event)"
    max="2000"
    step="100"
  />
  {state.duration}ms
</label>

<button>hold me down</button>

<if when="state.pressed">
  <p>held long enough — {state.duration}ms threshold reached</p>
</if>
