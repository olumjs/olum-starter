<script>
  import { props, onMount } from "olum";
  import { clickOutside } from "./click_outside.js";
  const { onOutsideClick } = props();

  onMount(() => {
    const action = clickOutside(host);
    const onOutClick = () => onOutsideClick();
    host.addEventListener("outclick", onOutClick);

    return () => {
      host.removeEventListener("outclick", onOutClick);
      action.destroy();
    };
  });
</script>

<div class="box">Tap outside dismiss</div>
