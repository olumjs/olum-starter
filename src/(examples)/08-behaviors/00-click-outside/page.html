<script>
  import OutsideBox from "./OutsideBox";
  const state = { showModal: true };
  const show = () => (state.showModal = true);
  const hide = () => (state.showModal = false);
</script>

<button onclick="show()">Open panel</button>
<if when="state.showModal">
  <OutsideBox onOutsideClick="{hide}" />
</if>
