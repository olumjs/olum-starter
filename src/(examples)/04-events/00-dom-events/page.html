<script>
  const state = { m: { x: 0, y: 0 } };

  const handleMousemove = (e) => {
    state.m = { x: e.clientX, y: e.clientY };
  };
</script>

<style>
  div {
    width: 100%;
    height: 100%;
    outline: 1px solid red;
  }
</style>

<div onmousemove="handleMousemove()">
  The mouse position is {state.m.x} x {state.m.y}
</div>
