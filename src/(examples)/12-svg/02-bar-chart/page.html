<script>
  import { scaleLinear } from "d3-scale";

  // Measured from the installed packages: dist build, minified, then gzipped.
  const bars = [
    { label: "olum", kb: 26.2 },
    { label: "olum min", kb: 8.7 },
    { label: "olum gz", kb: 3.2 },
    { label: "router", kb: 9.6 },
    { label: "router min", kb: 3.9 },
    { label: "router gz", kb: 1.9 },
  ];

  const yTicks = [0, 10, 20, 30];
  const padding = { top: 20, right: 15, bottom: 20, left: 25 };

  // Fixed size — no dimension bindings yet.
  const width = 500;
  const height = 200;

  const xScale = scaleLinear().domain([0, bars.length]).range([padding.left, width - padding.right]);
  const yScale = scaleLinear().domain([0, Math.max(...yTicks)]).range([height - padding.bottom, padding.top]);

  const barWidth = (width - padding.left - padding.right) / bars.length;
</script>

<h2>Olum bundle size</h2>

<div class="chart">
  <svg>
    <g class="axis y-axis">
      <for each="tick of yTicks">
        <g class="tick tick-{tick}" transform="translate(0, {yScale(tick)})">
          <line x2="100%" />
          <text y="-4">{tick} {tick === 30 ? 'kB' : ''}</text>
        </g>
      </for>
    </g>

    <g class="axis x-axis">
      <for each="(bar, i) of bars">
        <g class="tick" transform="translate({xScale(i)},{height})">
          <text x="{barWidth / 2}" y="-4">{bar.label}</text>
        </g>
      </for>
    </g>

    <g class="bars">
      <for each="(bar, i) of bars">
        <rect x="{xScale(i) + 2}" y="{yScale(bar.kb)}" width="{barWidth - 4}" height="{yScale(0) - yScale(bar.kb)}" />
      </for>
    </g>
  </svg>
</div>

<style>
  h2 {
    text-align: center;
  }

  .chart {
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
  }

  svg {
    position: relative;
    width: 100%;
    height: 200px;
  }

  .tick {
    font-size: 0.725em;
    font-weight: 200;
  }

  .tick line {
    stroke: #e2e2e2;
    stroke-dasharray: 2;
  }

  .tick text {
    fill: #888;
    text-anchor: start;
  }

  .tick.tick-0 line {
    stroke-dasharray: 0;
  }

  .x-axis .tick text {
    text-anchor: middle;
  }

  .bars rect {
    fill: #25c97e;
    stroke: none;
    opacity: 0.8;
  }
</style>
