<script>
  import { props } from "olum";
  import { scaleLinear } from "d3-scale";

  const { points } = props();

  // No dimension-binding / <Olum:window resize> port here: fixed at the
  // Olum example's initial width/height (see docs/limitations.md).
  const width = 500;
  const height = 200;
  const padding = { top: 20, right: 40, bottom: 40, left: 25 };

  const xScale = scaleLinear().domain([0, 20]).range([padding.left, width - padding.right]);
  const yScale = scaleLinear().domain([0, 12]).range([height - padding.bottom, padding.top]);
  const xTicks = width > 180 ? [0, 4, 8, 12, 16, 20] : [0, 10, 20];
  const yTicks = height > 180 ? [0, 2, 4, 6, 8, 10, 12] : [0, 4, 8, 12];
</script>

<svg>
  <g class="axis y-axis">
    <for each="tick of yTicks">
      <g class="tick tick-{tick}" transform="translate(0, {yScale(tick)})">
        <line x1="{padding.left}" x2="{xScale(22)}" />
        <text x="{padding.left - 8}" y="+4">{tick}</text>
      </g>
    </for>
  </g>

  <g class="axis x-axis">
    <for each="tick of xTicks">
      <g class="tick" transform="translate({xScale(tick)},0)">
        <line y1="{yScale(0)}" y2="{yScale(13)}" />
        <text y="{height - padding.bottom + 16}">{tick}</text>
      </g>
    </for>
  </g>

  <for each="point of points">
    <circle cx="{xScale(point.x)}" cy="{yScale(point.y)}" r="5" />
  </for>
</svg>

<style>
  svg {
    width: 50%;
    height: 50%;
    float: left;
  }

  circle {
    fill: orange;
    fill-opacity: 0.6;
    stroke: rgba(0, 0, 0, 0.5);
  }

  .tick line {
    stroke: #ddd;
    stroke-dasharray: 2;
  }

  text {
    font-size: 12px;
    fill: #999;
  }

  .x-axis text {
    text-anchor: middle;
  }

  .y-axis text {
    text-anchor: end;
  }
</style>
