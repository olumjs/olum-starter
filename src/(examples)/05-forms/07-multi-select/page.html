<script>
  const state = { slices: 1, toppings: ["Caramelized onions"] };

  const menu = ["Olives", "Caramelized onions", "Jalapeños"];

  const setSlices = (n) => (state.slices = n);

  const onSelectToppings = (e) => {
    state.toppings = Array.from(e.target.options)
      .filter((o) => o.selected)
      .map((o) => o.value);
  };

  const join = (toppings) => {
    if (toppings.length === 1) return toppings[0];
    return `${toppings.slice(0, -1).join(", ")} and ${toppings[toppings.length - 1]}`;
  };
</script>

<h2>Slices</h2>

<label>
  <input
    type="radio"
    name="slices"
    checked="{state.slices === 1}"
    onchange="setSlices(1)"
  />
  One slice
</label>

<label>
  <input
    type="radio"
    name="slices"
    checked="{state.slices === 2}"
    onchange="setSlices(2)"
  />
  Two slices
</label>

<label>
  <input
    type="radio"
    name="slices"
    checked="{state.slices === 3}"
    onchange="setSlices(3)"
  />
  Three slices
</label>

<h2>Toppings</h2>

<select multiple onchange="onSelectToppings($event)">
  <for each="topping of menu">
    <option value="{topping}" selected="{state.toppings.includes(topping)}">
      {topping}
    </option>
  </for>
</select>

<if when="state.toppings.length === 0">
  <p>Pick at least one topping</p>
</if>
<else-if when="state.toppings.length > state.slices">
  <p>That's more toppings than slices!</p>
</else-if>
<else>
  <p>
    You ordered {state.slices} {state.slices === 1 ? 'slice' : 'slices'} with
    {join(state.toppings)}
  </p>
</else>
