<script>
  const state = { files: null };

  const watcher = {
    files(old, files) {
      if (files) {
        for (const file of files) {
          console.log(`${file.name}: ${file.size} bytes`);
        }
      }
    },
  };

  const setFiles = (e) => (state.files = e.target.files);
</script>

<label for="shot">Upload a screenshot:</label>
<input
  accept="image/png, image/jpeg"
  onchange="setFiles($event)"
  id="shot"
  name="shot"
  type="file"
/>

<label for="many">Upload any number of files:</label>
<input onchange="setFiles($event)" id="many" multiple type="file" />

<if when="state.files">
  <h2>Uploaded:</h2>
  <for each="file of Array.from(state.files)">
    <p>{file.name} ({file.size} bytes)</p>
  </for>
</if>
