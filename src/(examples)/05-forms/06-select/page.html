<script>
  const state = {
    questions: [
      { id: 1, text: `Where did you first discover Olum?` },
      { id: 2, text: `What are you building with Olum?` },
      { id: 3, text: `Which doc page helped you the most?` },
    ],
    selected: null,
    answer: "",
  };

  const selectQuestion = (e) => {
    state.selected = state.questions[e.target.selectedIndex];
    state.answer = "";
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    alert(
      `answered question ${state.selected.id} (${state.selected.text}) with "${state.answer}"`,
    );
  };
</script>

<style>
  input {
    display: block;
    width: 500px;
    max-width: 100%;
  }
</style>

<h2>Quick poll</h2>

<form onsubmit="handleSubmit()">
  <select onchange="selectQuestion()">
    <for each="question of state.questions">
      <option
        value="{question.id}"
        selected="{state.selected && state.selected.id === question.id}"
      >
        {question.text}
      </option>
    </for>
  </select>

  <input
    value="{state.answer}"
    oninput="(e) => (state.answer = e.target.value)"
  />

  <button disabled="{!state.answer}" type="submit">Send</button>
</form>

<p>active question {state.selected ? state.selected.id : "[pick one]"}</p>
