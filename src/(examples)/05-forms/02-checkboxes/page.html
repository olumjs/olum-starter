<script>
  const state = { optIn: false };
</script>

<label>
  <input
    type="checkbox"
    checked="{state.optIn}"
    onchange="(e) => (state.optIn = e.target.checked)"
  />
  Notify me about new Olum releases
</label>

<if when="state.optIn">
  <p>You're subscribed — we'll ping you at the next release.</p>
</if>
<else>
  <p>No notifications then. You'll miss the changelog.</p>
</else>

<button disabled="{!state.optIn}">Sign up</button>
