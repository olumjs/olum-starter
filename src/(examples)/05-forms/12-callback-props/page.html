<script>
  import Keypad from "./Keypad";

  const state = { code: "" };

  const view = () => (state.code ? state.code.replace(/\d(?!$)/g, "•") : "enter your passcode");

  const setCode = (code) => (state.code = code); // callback prop — the child requests changes, this owner applies them

  const handleSubmit = () => alert(`unlocking with ${state.code}`);
</script>

<style>
  h1 {
    color: #ccc;
  }
  h1.code {
    color: #333;
  }
</style>

<h1 class="{state.code ? 'code' : ''}">{view()}</h1>

<Keypad value="{state.code}" onChange="{setCode}" onSubmit="{handleSubmit}" />
