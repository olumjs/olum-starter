<script>
  const state = {
    todos: [
      { done: false, text: "read the Olum docs" },
      { done: false, text: "port an example" },
      { done: false, text: "ship something real" },
    ],
  };

  const add = () => (state.todos = state.todos.concat({ done: false, text: "" }));
  const clear = () => (state.todos = state.todos.filter((t) => !t.done));
  const remaining = () => state.todos.filter((t) => !t.done).length;
  const toggleDone = (index, e) => {
    const newTodos = Array.from(state.todos);
    newTodos[index].done = e.target.checked;
    state.todos = newTodos;
  };

  const setText = (index, e) => {
    const newTodos = Array.from(state.todos);
    newTodos[index].text = e.target.value;
    state.todos = newTodos;
  };
</script>

<h1>Todos</h1>

<for each="(todo, index) of state.todos">
  <div>
    <input type="checkbox" checked="{todo.done}" onchange="toggleDone(index, $event)" />

    <input placeholder="What's next?" value="{todo.text}" oninput="setText(index,$event)" disabled="{todo.done}" />
  </div>
</for>

<p>{remaining()} remaining</p>

<button onclick="add()">Add new</button>

<button onclick="clear()">Clear completed</button>
