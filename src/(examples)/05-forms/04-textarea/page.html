<script>
  import { marked } from "marked";

  const state = {
    text: `Olum components are **plain HTML** with a splash of *JavaScript* mixed in`,
  };
</script>

<style>
  textarea {
    width: 100%;
    height: 200px;
  }
</style>

<textarea
  value="{state.text}"
  oninput="(e) => (state.text = e.target.value)"
></textarea>

<div html="marked(state.text)"></div>
