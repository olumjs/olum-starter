<script>
  const state = {
    topics: [
      { id: 1, text: "The compiler" },
      { id: 2, text: "The router" },
      { id: 3, text: "The docs" },
    ],
    selected: null,
    note: "",
  };

  const selectTopic = (e) => {
    state.selected = state.topics[e.target.selectedIndex];
    state.note = "";
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    alert(`Feedback on ${state.selected.text} (#${state.selected.id}): "${state.note}"`);
  };
</script>

<style>
  input {
    display: block;
    width: 500px;
    max-width: 100%;
  }
</style>

<h2>Tell us what to improve</h2>

<form onsubmit="handleSubmit()">
  <select onchange="selectTopic()">
    <for each="topic of state.topics">
      <option value="{topic.id}" selected="{state.selected && state.selected.id === topic.id}">
        {topic.text}
      </option>
    </for>
  </select>

  <input value="{state.note}" oninput="(e) => state.note = e.target.value" placeholder="what would you change?" />

  <button disabled="{!state.note}" type="submit"> Submit </button>
</form>

<p>selected topic {state.selected ? state.selected.id : "[waiting...]"}</p>
