<script>
  const state = { tier: 1, packages: ["olum"] };

  const tiers = { 1: "Minimal", 2: "Standard", 3: "Full" };
  const registry = ["olum", "olum-router", "olum-compiler"];

  const setTier = (tier) => (state.tier = tier);

  const selectPackages = (e) => {
    state.packages = Array.from(e.target.selectedOptions).map((o) => o.value);
  };

  const plural = (n) => (n === 1 ? "package" : "packages");

  const join = (list) => {
    if (list.length === 1) return list[0];
    return `${list.slice(0, -1).join(", ")} and ${list[list.length - 1]}`;
  };
</script>

<style>
  label {
    display: block;
  }
</style>

<h2>Template</h2>

<for each="tier of [1, 2, 3]">
  <label>
    <input type="radio" name="tier" checked="{state.tier === tier}" onchange="setTier(tier)" />
    {tiers[tier]} — up to {tier} {plural(tier)}
  </label>
</for>

<h2>Packages</h2>

<select multiple onchange="selectPackages()">
  <for each="pkg of registry">
    <option value="{pkg}" selected="{state.packages.includes(pkg)}">{pkg}</option>
  </for>
</select>

<if when="state.packages.length === 0">
  <p>Please select at least one package</p>
</if>
<else-if when="state.packages.length > state.tier">
  <p>The {tiers[state.tier]} template holds only {state.tier} {plural(state.tier)}</p>
</else-if>
<else>
  <p>Scaffolding {tiers[state.tier]} with {join(state.packages)}</p>
</else>
