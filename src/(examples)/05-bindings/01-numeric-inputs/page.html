<script>
  const state = { a: 1, b: 2 };
</script>

<label>
  <input type="number" value="{state.a}" oninput="(e) => state.a = +e.target.value" min="0" max="10" />
  <input type="range" value="{state.a}" oninput="(e) => state.a = +e.target.value" min="0" max="10" />
</label>

<label>
  <input type="number" value="{state.b}" oninput="(e) => state.b = +e.target.value" min="0" max="10" />
  <input type="range" value="{state.b}" oninput="(e) => state.b = +e.target.value" min="0" max="10" />
</label>

<p>{state.a} + {state.b} = {state.a + state.b}</p>
