<script>
  const state = { files: null };

  const watcher = {
    files(old, files) {
      if (files) {
        // Note that `files` is of type `FileList`, not an Array:
        // https://developer.mozilla.org/en-US/docs/Web/API/FileList
        console.log(files);

        for (const file of files) {
          console.log(`${file.name}: ${file.size} bytes`);
        }
      }
    },
  };

  const setFiles = (e) => (state.files = e.target.files);
</script>

<label for="avatar">Upload a picture:</label>
<input accept="image/png, image/jpeg" onchange="setFiles($event)" id="avatar" name="avatar" type="file" />

<label for="many">Upload multiple files of any type:</label>
<input onchange="setFiles($event)" id="many" multiple type="file" />

<if when="state.files">
  <h2>Selected files:</h2>
  <for each="file of Array.from(state.files)">
    <p>{file.name} ({file.size} bytes)</p>
  </for>
</if>
