<script>
  const state = { yes: false };
</script>

<label>
  <input type="checkbox" checked="{state.yes}" onchange="(e) => state.yes = e.target.checked" />
  Email me when a new Olum version ships
</label>

<if when="state.yes">
  <p>You're subscribed — expect a note on each release, nothing else.</p>
</if>
<else>
  <p>Tick the box to opt in.</p>
</else>

<button disabled="{!state.yes}"> Subscribe </button>
