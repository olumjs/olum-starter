<script>
  import { props } from "olum";

  const select = (num) => (props().value = (props().value || "") + num);
  const clear = () => (props().value = "");
</script>

<style>
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 5em);
    grid-template-rows: repeat(4, 3em);
    grid-gap: 0.5em;
  }

  button {
    margin: 0;
  }
</style>

<div class="keypad">
  <for each="num of [1, 2, 3, 4, 5, 6, 7, 8, 9]">
    <button onclick="select(num)">{num}</button>
  </for>

  <button disabled="{!props().value}" onclick="clear()">clear</button>
  <button onclick="select(0)">0</button>
  <button disabled="{!props().value}" onclick="props().onSubmit()">submit</button>
</div>
