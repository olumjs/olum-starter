<script>
  const state = {
    scoops: 1,
    flavours: ["Mint choc chip"],
    menu: ["Cookies and cream", "Mint choc chip", "Raspberry ripple"],
  };

  const setScoops = (n) => () => (state.scoops = n);

  const toggleFlavour = (flavour) => (e) => {
    if (e.target.checked) state.flavours = state.flavours.concat(flavour);
    else state.flavours = state.flavours.filter((f) => f !== flavour);
  };

  const join = (flavours) => {
    if (flavours.length === 1) return flavours[0];
    return `${flavours.slice(0, -1).join(", ")} and ${flavours[flavours.length - 1]}`;
  };
</script>

<h2>Size</h2>

<label>
  <input type="radio" checked="{state.scoops === 1}" onchange="setScoops(1)()" />
  One scoop
</label>

<label>
  <input type="radio" checked="{state.scoops === 2}" onchange="setScoops(2)()" />
  Two scoops
</label>

<label>
  <input type="radio" checked="{state.scoops === 3}" onchange="setScoops(3)()" />
  Three scoops
</label>

<h2>Flavours</h2>

<for each="flavour of state.menu">
  <label>
    <input type="checkbox" checked="{state.flavours.includes(flavour)}" onchange="toggleFlavour(flavour)($event)" />
    {flavour}
  </label>
</for>

<if when="state.flavours.length === 0">
  <p>Please select at least one flavour</p>
</if>
<else-if when="state.flavours.length > state.scoops">
  <p>Can't order more flavours than scoops!</p>
</else-if>
<else>
  <p>
    You ordered {state.scoops}
    {state.scoops === 1 ? "scoop" : "scoops"}
    of {join(state.flavours)}
  </p>
</else>
