<script>
  import { marked } from "marked";

  const state = { text: `Some words are *italic*, some are **bold**` };
</script>

<style>
  textarea {
    width: 100%;
    height: 200px;
  }
</style>

<textarea value="{state.text}" oninput="(e) => state.text = e.target.value"></textarea>

<div html="marked(state.text)"></div>
