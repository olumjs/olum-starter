<!-- No dynamic <component this={...}/> equivalent yet: switch over the known
     component set with if/else-if, driven by a plain string in state. -->
<script>
  import CorePanel from "./CorePanel";
  import RouterPanel from "./RouterPanel";
  import CompilerPanel from "./CompilerPanel";

  const state = { pkg: "core" };
</script>

<select onchange="(e) => state.pkg = e.target.value">
  <option value="core" selected="{state.pkg === 'core'}">olum</option>
  <option value="router" selected="{state.pkg === 'router'}">olum-router</option>
  <option value="compiler" selected="{state.pkg === 'compiler'}">olum-compiler</option>
</select>

<if when="state.pkg === 'core'">
  <CorePanel />
</if>
<else-if when="state.pkg === 'router'">
  <RouterPanel />
</else-if>
<else>
  <CompilerPanel />
</else>
