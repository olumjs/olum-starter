<script>
  import Circle from "./Circle";
  import Square from "./Square";
  import Triangle from "./Triangle";

  const state = { shape: "circle" };
</script>

<select onchange="(e) => (state.shape = e.target.value)">
  <option value="circle" selected="{state.shape === 'circle'}">circle</option>
  <option value="square" selected="{state.shape === 'square'}">square</option>
  <option value="triangle" selected="{state.shape === 'triangle'}">
    triangle
  </option>
</select>

<if when="state.shape === 'circle'">
  <Circle />
</if>
<else-if when="state.shape === 'square'">
  <Square />
</else-if>
<else>
  <Triangle />
</else>
