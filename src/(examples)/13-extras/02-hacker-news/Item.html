<script>
  import { props } from "olum";
  import Comment from "./Comment";
  const { item, returnPage } = props();

  const url = () =>
    !item.domain ? `https://news.ycombinator.com/${item.url}` : item.url;
</script>

<a class="back" href="?page={returnPage}">&larr; all stories</a>

<article>
  <a class="title-link" href="{url()}">
    <h1>{item.title}</h1>
    <if when="item.domain">
      <span class="domain">{item.domain}</span>
    </if>
  </a>

  <p class="meta">
    <span class="score">{item.points} points</span>
    <span class="sep">·</span>
    posted by {item.user} {item.time_ago}
  </p>
</article>

<if when="item.comments_count">

<div class="comments">

    <Comment comment="{comment}" />
  </for>
</div>
