<script>
  import { props } from "olum";
  const { item, i, offset } = props();

  const commentText = () => {
    const c = item.comments_count;
    return `${c} ${c === 1 ? "comment" : "comments"}`;
  };

  const url = () =>
    item.type === "ask" ? `https://news.ycombinator.com/${item.url}` : item.url;
</script>

<article>
  <span class="rank">{i + offset + 1}</span>
  <div class="body">
    <h2>
      <a target="_blank" rel="noreferrer" href="{url()}">{item.title}</a>
      <if when="item.domain">
        <span class="domain">{item.domain}</span>
      </if>
    </h2>
    <p class="meta">
      <span class="score">{item.points} points</span>
      <span class="sep">·</span>
      by {item.user} {item.time_ago}
      <span class="sep">·</span>
      <a class="comments-link" href="?item={item.id}">{commentText()}</a>
    </p>
  </div>
</article>
