<script>
  import { props } from "olum";
  import Summary from "./Summary";
  const { items, page, offset, maxPage } = props();

  const pageNumbers = () => {
    const delta = 1;
    const nums = [];
    for (let p = 1; p <= maxPage; p++) {
      if (
        p === 1 ||
        p === maxPage ||
        (p >= page - delta && p <= page + delta)
      ) {
        nums.push(p);
      } else if (nums[nums.length - 1] !== "…") {
        nums.push("…");
      }
    }
    return nums;
  };
</script>

<if when="items">
  <div class="stories">
    <for each="(item, i, arr) of items" key="item.id">
      <summary item="{item}" i="{i}" offset="{offset}" />
    </for>
  </div>

  <nav class="pagination">
    <if when="page > 1">
      <a class="nav-link" href="?page={page - 1}">&lsaquo; Prev</a>
    </if>
    <else>
      <span class="nav-link disabled">&lsaquo; Prev</span>
    </else>

    <div class="pages">
      <for each="(p, i) of pageNumbers()" key="i">
        <if when="p === '…'">
          <span class="ellipsis">…</span>
        </if>
        <else-if when="p === page">
          <span class="page current">{p}</span>
        </else-if>
        <else>
          <a class="page" href="?page={p}">{p}</a>
        </else>
      </for>
    </div>

    <if when="page < maxPage">
      <a class="nav-link" href="?page={page + 1}">Next &rsaquo;</a>
    </if>
    <else>
      <span class="nav-link disabled">Next &rsaquo;</span>
    </else>
  </nav>
</if>
<else>
  <p class="loading">fetching stories…</p>
</else>
