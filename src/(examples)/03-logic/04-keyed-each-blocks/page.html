<script>
  import Thing from "./Thing";

  const state = {
    things: [
      { id: 1, color: "darkblue" },
      { id: 2, color: "indigo" },
      { id: 3, color: "deeppink" },
      { id: 4, color: "salmon" },
      { id: 5, color: "gold" },
    ],
  };

  const handleClick = () => (state.things = state.things.slice(1));
</script>

<button onclick="handleClick()">Remove first thing</button>

<div style="display:grid; grid-template-columns:1fr 1fr; grid-gap:1em;">
  <div>
    <h2>Keyed</h2>
    <for each="thing of state.things" key="thing.id">
      <Thing current="{thing.color}" />
    </for>
  </div>

  <div>
    <h2>Unkeyed</h2>
    <for each="thing of state.things">
      <Thing current="{thing.color}" />
    </for>
  </div>
</div>
