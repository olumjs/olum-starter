<script>
  import { onMount } from "olum";
  import { spring } from "./spring.js";

  const state = { x: 50, y: 50, size: 10, stiffness: 0.1, damping: 0.25 };

  const coords = spring(
    { x: 50, y: 50 },
    { stiffness: state.stiffness, damping: state.damping },
    (v) => {
      state.x = v.x;
      state.y = v.y;
    },
  );
  const size = spring(10, {}, (v) => (state.size = v));

  const setStiffness = (e) => {
    state.stiffness = +e.target.value;
    coords.stiffness = state.stiffness;
  };
  const setDamping = (e) => {
    state.damping = +e.target.value;
    coords.damping = state.damping;
  };

  const move = (e) => coords.set({ x: e.clientX, y: e.clientY });
  const grow = () => size.set(30);
  const shrink = () => size.set(10);

  onMount(() => () => {
    coords.cancel();
    size.cancel();
  });
</script>

<div class="controls">
  <label>
    <h3>stiffness ({state.stiffness})</h3>
    <input
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="{state.stiffness}"
      oninput="setStiffness($event)"
    />
  </label>

  <label>
    <h3>damping ({state.damping})</h3>
    <input
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="{state.damping}"
      oninput="setDamping($event)"
    />
  </label>
</div>

<svg onmousemove="move($event)" onmousedown="grow()" onmouseup="shrink()">
  <circle cx="{state.x}" cy="{state.y}" r="{state.size}"></circle>
</svg>

<style>
  .controls {
    position: absolute;
    right: 1em;
    z-index: 1;
  }

  svg {
    width: 100%;
    height: 100%;
    margin: -8px;
  }

  circle {
    fill: #25C97E;
  }
</style>
