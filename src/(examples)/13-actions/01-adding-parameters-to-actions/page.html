<!--
  Olum has no `use:action` directive: the longpress action is wired up by
  hand in onMount against the button, found via host.querySelector. Its
  `update(newDuration)` hook isn't needed here — any state change (e.g. moving
  the range slider) rebuilds this whole component (see docs/limitations.md),
  which naturally re-runs onMount and re-attaches the action with the current
  state.duration, so the action always sees the latest value on next mount.
-->
<script>
  import { onMount } from "olum";
  import { longpress } from "./longpress.js";

  const state = { pressed: false, duration: 2000 };
  const setDuration = (e) => (state.duration = +e.target.value);

  onMount(() => {
    const button = host.querySelector("button");
    const action = longpress(button, state.duration);
    const onLongpress = () => (state.pressed = true);
    const onMouseenter = () => (state.pressed = false);

    button.addEventListener("longpress", onLongpress);
    button.addEventListener("mouseenter", onMouseenter);

    return () => {
      button.removeEventListener("longpress", onLongpress);
      button.removeEventListener("mouseenter", onMouseenter);
      action.destroy();
    };
  });
</script>

<label>
  <input type="range" value="{state.duration}" oninput="setDuration($event)" max="2000" step="100" />
  {state.duration}ms
</label>

<button>press and hold</button>

<if when="state.pressed">
  <p>congratulations, you pressed and held for {state.duration}ms</p>
</if>
