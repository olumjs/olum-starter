<!--
  Olum has no `use:action` directive and onMount is component-scoped (not
  per-element), so the clickOutside action is wired up on this small wrapper
  component's own root element instead of directly on a <div> in App.html.
  This component mounts/unmounts exactly when the <if> in App.html toggles,
  which lines up with the action's own mount/destroy timing.
-->
<script>
  import { props, onMount } from "olum";
  import { clickOutside } from "./click_outside.js";

  onMount(() => {
    const action = clickOutside(host);
    const onOutClick = () => props().onOutsideClick();
    host.addEventListener("outclick", onOutClick);

    return () => {
      host.removeEventListener("outclick", onOutClick);
      action.destroy();
    };
  });
</script>

<div class="box">Click outside me!</div>

<style>
  .box {
    --width: 100px;
    --height: 100px;
    position: absolute;
    width: var(--width);
    height: var(--height);
    left: calc(50% - var(--width) / 2);
    top: calc(50% - var(--height) / 2);
    display: flex;
    align-items: center;
    padding: 8px;
    border-radius: 4px;
    background-color: #ff3e00;
    color: #fff;
    text-align: center;
    font-weight: bold;
  }
</style>
