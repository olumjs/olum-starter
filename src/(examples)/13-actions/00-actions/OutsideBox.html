<!--
  onMount is component-scoped rather than per-element, so clickOutside is wired
  up on this wrapper's own root. It mounts and unmounts with the <if> in
  page.html, which is exactly the action's lifetime.
-->
<script>
  import { props, onMount } from "olum";
  import { clickOutside } from "./click_outside.js";

  onMount(() => {
    const action = clickOutside(host);
    const onOutClick = () => props().onOutsideClick();
    host.addEventListener("outclick", onOutClick);

    return () => {
      host.removeEventListener("outclick", onOutClick);
      action.destroy();
    };
  });
</script>

<div class="box">Click outside me!</div>

<style>
  .box {
    --width: 100px;
    --height: 100px;
    position: absolute;
    width: var(--width);
    height: var(--height);
    left: calc(50% - var(--width) / 2);
    top: calc(50% - var(--height) / 2);
    display: flex;
    align-items: center;
    padding: 8px;
    border-radius: 4px;
    background-color: #25c97e;
    color: #fff;
    text-align: center;
    font-weight: bold;
  }
</style>
