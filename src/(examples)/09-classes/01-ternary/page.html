<script>
  const state = { zoom: false };
  const setZoom = (e) => (state.zoom = e.target.checked);
</script>

<label>
  <input type="checkbox" checked="{state.zoom}" onchange="setZoom($event)" />
  magnify
</label>

<div class="{state.zoom ? 'zoom' : ''}">
  this text is {state.zoom ? 'huge' : 'regular-sized'}
</div>

<style>
  .zoom {
    font-size: 4em;
  }
</style>
