<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: white;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .counter {
    text-align: center;
  }

  .value {
    font-size: 96px;
    font-weight: 700;
    color: #111;
  }

  button {
    margin-top: 24px;
    border: 1px solid #e5e7eb;
    background: white;
    border-radius: 999px;
    padding: 12px 28px;
    font-size: 15px;
    cursor: pointer;
  }

  button:hover {
    background: #f8fafc;
  }
</style>

<script>
  const state = { counter: 0 };
  const clickHandler = () => state.counter++;
</script>

<div class="counter">
  <div class="value">{state.counter}</div>
  <button onclick="clickHandler()">Add One</button>
</div>
