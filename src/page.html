<script>
  const routes = [
    { path: "/basics/first-component", name: "BasicsFirstComponent" },
    { path: "/basics/attribute-values", name: "BasicsAttributeValues" },
    { path: "/basics/component-styles", name: "BasicsComponentStyles" },
    { path: "/basics/child-components", name: "BasicsChildComponents" },
    { path: "/basics/raw-html", name: "BasicsRawHtml" },
    { path: "/state/updates", name: "StateUpdates" },
    { path: "/state/derived-values", name: "StateDerivedValues" },
    { path: "/state/watchers", name: "StateWatchers" },
    { path: "/state/global-store", name: "StateGlobalStore" },
    { path: "/props/reading-props", name: "PropsReadingProps" },
    { path: "/props/defaults", name: "PropsDefaults" },
    { path: "/props/passing-objects", name: "PropsPassingObjects" },
    { path: "/control-flow/if", name: "ControlFlowIf" },
    { path: "/control-flow/if-else", name: "ControlFlowIfElse" },
    { path: "/control-flow/else-if-chains", name: "ControlFlowElseIfChains" },
    { path: "/control-flow/for-loops", name: "ControlFlowForLoops" },
    { path: "/control-flow/keyed-loops", name: "ControlFlowKeyedLoops" },
    { path: "/events/method-listeners", name: "EventsMethodListeners" },
    { path: "/events/arrow-listeners", name: "EventsArrowListeners" },
    { path: "/events/function-props", name: "EventsFunctionProps" },
    { path: "/events/callback-forwarding", name: "EventsCallbackForwarding" },
    { path: "/events/handler-props", name: "EventsHandlerProps" },
    { path: "/forms/text", name: "FormsText" },
    { path: "/forms/numbers", name: "FormsNumbers" },
    { path: "/forms/checkboxes", name: "FormsCheckboxes" },
    { path: "/forms/radio-groups", name: "FormsRadioGroups" },
    { path: "/forms/textarea", name: "FormsTextarea" },
    { path: "/forms/files", name: "FormsFiles" },
    { path: "/forms/select", name: "FormsSelect" },
    { path: "/forms/multi-select", name: "FormsMultiSelect" },
    { path: "/forms/loop-inputs", name: "FormsLoopInputs" },
    { path: "/forms/host-element", name: "FormsHostElement" },
    { path: "/forms/callback-props", name: "FormsCallbackProps" },
    { path: "/forms/dimensions", name: "FormsDimensions" },
    { path: "/forms/media-elements", name: "FormsMediaElements" },
    { path: "/lifecycle/mount-hook", name: "LifecycleMountHook" },
    { path: "/lifecycle/cleanup", name: "LifecycleCleanup" },
    { path: "/lifecycle/tick", name: "LifecycleTick" },
    { path: "/motion/tweened", name: "MotionTweened" },
    { path: "/motion/spring", name: "MotionSpring" },
    { path: "/debugging/debug", name: "DebuggingDebug" },
    { path: "/transitions/transition", name: "TransitionsTransition" },
    {
      path: "/transitions/adding-parameters",
      name: "TransitionsAddingParameters",
    },
    { path: "/transitions/in-and-out", name: "TransitionsInAndOut" },
    { path: "/transitions/custom-css", name: "TransitionsCustomCss" },
    { path: "/transitions/custom-js", name: "TransitionsCustomJs" },
    {
      path: "/transitions/transition-events",
      name: "TransitionsTransitionEvents",
    },
    { path: "/transitions/svg-transitions", name: "TransitionsSvgTransitions" },
    { path: "/transitions/deferred", name: "TransitionsDeferred" },
    { path: "/transitions/crossfade", name: "TransitionsCrossfade" },
    { path: "/animations/flip", name: "AnimationsFlip" },
    { path: "/easing/ease-visualiser", name: "EasingEaseVisualiser" },
    { path: "/graphics/analog-clock", name: "GraphicsAnalogClock" },
    { path: "/graphics/bar-chart", name: "GraphicsBarChart" },
    { path: "/graphics/area-chart", name: "GraphicsAreaChart" },
    { path: "/graphics/scatterplot", name: "GraphicsScatterplot" },
    { path: "/behaviors/click-outside", name: "BehaviorsClickOutside" },
    { path: "/behaviors/long-press", name: "BehaviorsLongPress" },
    { path: "/classes/toggling", name: "ClassesToggling" },
    { path: "/classes/ternary", name: "ClassesTernary" },
    { path: "/composition/children", name: "CompositionChildren" },
    { path: "/composition/fallback-content", name: "CompositionFallbackContent" },
    { path: "/globals/window-events", name: "GlobalsWindowEvents" },
    { path: "/globals/document-events", name: "GlobalsDocumentEvents" },
    { path: "/7guis/counter", name: "SevenGuisCounter" },
    { path: "/7guis/temperature", name: "SevenGuisTemperature" },
    { path: "/7guis/flight-booker", name: "SevenGuisFlightBooker" },
    { path: "/7guis/timer", name: "SevenGuisTimer" },
    { path: "/7guis/crud", name: "SevenGuisCrud" },
    { path: "/7guis/circles", name: "SevenGuisCircles" },
    { path: "/extras/tree-view", name: "ExtrasTreeView" },
    { path: "/extras/component-switching", name: "ExtrasComponentSwitching" },
    { path: "/extras/hacker-news", name: "ExtrasHackerNews" },
    { path: "/todo-app", name: "TodoApp" },
  ];

  const grouped = routes.reduce((map, route) => {
    const section = route.path.split("/")[1];
    if (!map[section]) map[section] = [];
    map[section].push(route);
    return map;
  }, {});

  const sectionTitle = (section) =>
    section === "7guis"
      ? "7GUIs"
      : section.charAt(0).toUpperCase() + section.slice(1).replace(/-/g, " ");

  const linkLabel = (path) => path.split("/").pop().replace(/-/g, " ");

  const state = { expanded: {} };
  const isOpen = (section) => !!state.expanded[section];
  const toggle = (section) =>
    (state.expanded = { ...state.expanded, [section]: !state.expanded[section] });
</script>

<h1>Olum by example</h1>

<div class="tree">
  <for each="(section, i, links) in grouped">
    <div>
      <button
        class="{isOpen(section) ? 'expanded' : ''}"
        onclick="toggle(section)"
      >
        {sectionTitle(section)}
      </button>
      <if when="isOpen(section)">
        <ul>
          <for each="route of links">
            <li>
              <a href="{route.path}">{linkLabel(route.path)}</a>
            </li>
          </for>
        </ul>
      </if>
    </div>
  </for>
</div>

    max-width: 480px;

    cursor: pointer;
    border: none;
    font-size: 15px;
    color: inherit;
  }

  .expanded {
    background-image: url(/assets/folder-open.svg);
  }

  ul {
    list-style-type: none;
    padding: 0.2em 0 0.4em 0.6em;
    margin: 0 0 0 0.55em;
    border-left: 1px solid #e4e4e7;
  }

  li {
    padding: 0.15em 0;
    text-transform: capitalize;
  }

  a {
    padding: 0 0 0 1.7em;

    background-size: 1.2em 1.2em;
  }
</style>
